name: Quite Frankly Newsletter

on:
  schedule:
    # 12:00 UTC = 8:00 AM EDT (summer). In winter this runs at 7:00 AM EST - still fine.
    - cron: '0 12 * * *'
  workflow_dispatch: # lets you trigger a test run manually from the GitHub UI

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    permissions:
      contents: write # needed to commit seen_links.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:     ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:${{ secrets.GMAIL_APP_PASSWORD }}
        run: python newsletter.py

      - name: Save seen_links cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_links.json
          git diff --staged --quiet || git commit -m "chore: update seen_links cache [skip ci]"
          git push

name: Quite Frankly Newsletter

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (production sends real email and updates dedup cache; test bypasses the cache and prefixes the subject with [TEST])'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - test

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    permissions:
      contents: write # needed to commit seen_links.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:     ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MODE:              ${{ inputs.mode }}
        run: python newsletter.py

      - name: Save seen_links cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_links.json
          git diff --staged --quiet || git commit -m "chore: update seen_links cache [skip ci]"
          git push

name: Quite Frankly Newsletter

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (production sends real email and updates dedup cache; test bypasses the cache and prefixes the subject with [TEST])'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - test

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    permissions:
      contents: write # needed to commit seen_links.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Fail in seconds if the Gmail App Password is dead (revoked via Security
      # Checkup, Google password change, or 2SV toggled). Without this the run
      # spends ~6 minutes of Anthropic calls before send_email discovers it.
      - name: Check Gmail credentials
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'EOF'
          import os, smtplib
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=20) as s:
              s.login(os.environ["GMAIL_ADDRESS"], os.environ["GMAIL_APP_PASSWORD"])
          print("SMTP login OK")
          EOF

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:     ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MODE:              ${{ inputs.mode }}
          PYTHONUNBUFFERED:  "1"
        run: python -u newsletter.py

      - name: Save caches
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_links.json design_archive.json
          git diff --staged --quiet || git commit -m "chore: update caches [skip ci]"
          git push
